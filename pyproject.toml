[project]
name = "contextgraph"
version = "0.1.0"
description = "A local code graph and memory for coding agents: the code, links, tests and past findings that matter for a task, within a token budget."
readme = "README.md"
license = "Apache-2.0"
keywords = ["claude-code", "codex", "coding-agents", "code-graph", "context", "memory", "tokens"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4", "numpy>=1.26"]

[project.scripts]
contextgraph = "contextgraph.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills/contextgraph/SKILL.md" = "contextgraph/_skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
